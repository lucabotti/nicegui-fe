[project]
name = "htmx-fe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luca Botti", email = "lbotti@red.software.systems" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.127.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-keycloak>=5.8.1",
    "python-multipart>=0.0.21",
    "redis>=7.1.0",
    "starlette-session-middleware>=0.1.6",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest",
    "pytest-asyncio",
    "redis",
    "ruff",
    "testcontainers>=4.13.3",
    "ty",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "U"]
ignore = []
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
