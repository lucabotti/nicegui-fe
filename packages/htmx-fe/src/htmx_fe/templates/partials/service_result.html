{% if error %}
<div class="w-full p-4 bg-red-50 border border-red-100 text-red-700 rounded-xl animate-in fade-in zoom-in duration-300">
    <div class="flex items-center mb-2">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span class="font-bold">Error</span>
    </div>
    <p>{{ error }}</p>
</div>
{% elif data %}
<div class="w-full space-y-4 animate-in fade-in slide-in-from-top-4 duration-300">
    <div class="p-4 bg-green-50 border border-green-100 text-green-700 rounded-xl flex items-center">
        <i class="fas fa-check-circle mr-2"></i>
        <span class="font-bold">{{ data.message }}</span>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
        <div
            class="px-4 py-2 bg-slate-50 border-b border-slate-100 flex justify-between items-center text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <span>Response from service</span>
        </div>
        <pre class="p-4 bg-slate-900 text-blue-400 text-sm overflow-auto max-h-60">{{ data | tojson(indent=2) }}</pre>
    </div>
</div>
{% endif %}
