{% for org in organizations %}
<tr>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">{{ org.id }}</td>
    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-900">{{ org.name }}</td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">
        <button hx-delete="/organizations/{{ org.id }}" hx-confirm="Are you sure?" hx-target="closest tr"
            hx-swap="outerHTML" class="text-red-600 hover:text-red-900">
            <i class="fas fa-trash"></i>
        </button>
    </td>
</tr>
{% else %}
<tr>
    <td colspan="3" class="px-6 py-4 text-center text-slate-400">No organizations found.</td>
</tr>
{% endfor %}
