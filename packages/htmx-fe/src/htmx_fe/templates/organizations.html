{% extends "base.html" %}

{% block layout %}
<div class="flex flex-col h-screen">
    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-lg z-20">
        <div class="px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <a href="/" class="p-2 rounded-full hover:bg-blue-700 transition-colors">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h1 class="text-xl font-bold tracking-tight">Organization Management</h1>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-slate-50">
        <div class="max-w-4xl mx-auto space-y-8">
            <!-- Add Organization Form -->
            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50">
                    <h3 class="font-bold text-slate-800">Add New Organization</h3>
                </div>
                <div class="p-6">
                    <form hx-post="/organizations" hx-target="#organization-list" hx-swap="innerHTML"
                        class="flex gap-4 items-end">
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-slate-700">Organization Name</label>
                            <input type="text" name="name" required
                                class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm border p-2">
                        </div>
                        <button type="submit"
                            class="bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                            Add Organization
                        </button>
                    </form>
                </div>
            </section>

            <!-- Organization List -->
            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                    <h3 class="font-bold text-slate-800">Organization List</h3>
                    <button hx-get="/organizations/list" hx-target="#organization-list" class="text-blue-600 hover:text-blue-800">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-slate-200">
                        <thead class="bg-slate-50">
                            <tr>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">
                                    ID</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">
                                    Name</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">
                                    Actions</th>
                            </tr>
                        </thead>
                        <tbody id="organization-list"
                            class="bg-white divide-y divide-slate-200">
                            {% include "partials/organization_list.html" %}
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</div>
{% endblock %}
