receivers:
  redis:
    endpoint: "redis:6379"
    collection_interval: 10s

processors:
  batch:
    timeout: 10s

exporters:
  otlp:
    endpoint: "otel-collector:4317"
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [redis]
      processors: [batch]
      exporters: [otlp]
